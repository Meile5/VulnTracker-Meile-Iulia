services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: vulntracker
      POSTGRES_USER: vulntracker
      POSTGRES_PASSWORD: dev-only-password
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=vulntracker;Username=vulntracker;Password=dev-only-password"
    depends_on:
      - db

volumes:
  pgdata: