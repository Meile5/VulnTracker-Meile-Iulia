name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Aikido Security Scan
        uses: AikidoSec/github-actions-workflow@v1.0.13
        with:
          secret-key: ${{ secrets.AIKIDO_SECRET_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          minimum-severity: high
          fail-on-dependency-scan: true
          fail-on-sast-scan: true
          
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vulntracker
          POSTGRES_USER: vulntracker
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - name: Test
        env:
          ConnectionStrings__Default: "Host=localhost;Port=5432;Database=vulntracker;Username=vulntracker;Password=${{ secrets.CI_DB_PASSWORD }}"
        run: dotnet test --no-build -c Release