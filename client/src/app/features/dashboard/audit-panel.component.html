<div class="pink-card">
  <h2 class="pink-title text-2xl mb-2">audit log 🔍</h2>
  @if (error()) {
    <p class="pink-error">{{ error() }}</p>
  } @else if (logs().length === 0) {
    <p>no audit events yet ✨</p>
  } @else {
    <table class="w-full text-sm">
      <thead>
      <tr class="text-left text-pink-700"><th>when</th><th>who</th><th>action</th><th>details</th></tr>
      </thead>
      <tbody>
        @for (l of $any(logs()); track l.id) {
          <tr class="border-t border-pink-100">
            <td>{{ l.timestamp.slice(0, 19).replace('T', ' ') }}</td>
            <td>{{ l.actor }}</td>
            <td>{{ l.action }}</td>
            <td>{{ l.details }}</td>
          </tr>
        }
      </tbody>
    </table>
  }
</div>
