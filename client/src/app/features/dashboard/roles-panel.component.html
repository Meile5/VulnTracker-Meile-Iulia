<div class="pink-card max-w-md flex flex-col gap-2">
  <h2 class="pink-title text-2xl">user roles 👯</h2>
  <label class="pink-label">user</label>
  <select class="pink-input" [ngModel]="userId" (ngModelChange)="pick($event)">
    <option value="">choose a user</option>
    @for (u of users(); track u.id) {
      <option [value]="u.id">{{ u.displayName }} ({{ u.username }})</option>
    }
  </select>
  <label class="pink-label">roles</label>
  @for (r of roles; track r) {
    <label class="flex items-center gap-2">
      <input type="checkbox" [checked]="has(r)" (change)="toggle(r, $event)" /> {{ r }}
    </label>
  }
  <button class="pink-btn mt-2" (click)="save()" [disabled]="!userId.trim()">save roles 💖</button>
  @if (msg()) {
    <p class="pink-ok">{{ msg() }}</p>
  }
</div>
